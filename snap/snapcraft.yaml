name: browser-alpha-matting
base: core22
version: '1.1.3'
summary: Deterministic 32-bit RGBA alpha matting and DICOM pixel calibration CLI
description: |
  Command-line utility implementing Porter-Duff unassociated 32-bit RGBA
  foreground color decontamination, C1 Cubic Hermite boundary feathering, and
  NEMA DICOM PS3.3 Section 10.7 anisotropic RowSpacing/ColumnSpacing physical
  distance calibration.
grade: stable
confinement: strict
license: MIT
website: https://utilvo.com/background-remover
source-code: https://github.com/utilvo/browser-alpha-matting
issues: https://github.com/utilvo/browser-alpha-matting/issues

apps:
  browser-alpha-matting:
    command: bin/browser-alpha-matting

parts:
  cli:
    plugin: dump
    source: .
    organize:
      snap-bin/browser-alpha-matting: bin/browser-alpha-matting
    stage:
      - bin/browser-alpha-matting
